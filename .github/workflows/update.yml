name: 통계 자동 수집·리포트 갱신

on:
  workflow_dispatch:
    inputs:
      discover:
        description: "KOSIS 키워드 검색으로 후보 통계표 목록도 저장"
        type: boolean
        default: false
  schedule:
    # 매월 1일 09:00 KST (고용형태별근로실태조사는 연 1회 4월말 공표 — 월 단위로 확인해 새 연도를 자동 반영)
    - cron: "0 0 1 * *"
  push:
    branches: [main]
    paths: ["pipeline/**", "config/**", "data/manual/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 단위 테스트
        run: python -m unittest discover -s tests -v
      - name: 수집 → 정제 → 분석 → 리포트
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$KOSIS_API_KEY" ]; then echo "::error::KOSIS_API_KEY 시크릿이 없습니다"; exit 1; fi
          python -m pipeline.run all --discover
      - name: 변경된 데이터·리포트 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "data: 자동 수집·리포트 갱신 ($(date -u +%Y-%m-%d))" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
